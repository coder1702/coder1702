<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 24" width="1200" height="24" role="presentation" aria-hidden="true" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"   stop-color="#1F6FEB" stop-opacity="0"/>
      <stop offset="0.3" stop-color="#58A6FF"/>
      <stop offset="0.7" stop-color="#8957E5"/>
      <stop offset="1"   stop-color="#8957E5" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="dot" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.35" stop-color="#58A6FF" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#58A6FF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect x="0" y="11" width="1200" height="2" rx="1" fill="url(#line)"/>

  <!-- centre marker -->
  <rect x="594" y="6" width="12" height="12" rx="2" transform="rotate(45 600 12)" fill="#0D1117" stroke="#58A6FF" stroke-width="1.5"/>

  <!-- travelling glow -->
  <circle cy="12" r="9" fill="url(#dot)">
    <animate attributeName="cx" values="100;1100;100" dur="8s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.5;1" keySplines="0.45 0 0.55 1;0.45 0 0.55 1"/>
  </circle>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
