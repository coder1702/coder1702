<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 120" width="1200" height="120" role="presentation" aria-hidden="true" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="wave1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"    stop-color="#8957E5"/>
      <stop offset="0.25" stop-color="#1F6FEB"/>
      <stop offset="0.5"  stop-color="#8957E5"/>
      <stop offset="0.75" stop-color="#1F6FEB"/>
      <stop offset="1"    stop-color="#8957E5"/>
    </linearGradient>
    <linearGradient id="wave2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"    stop-color="#58A6FF"/>
      <stop offset="0.25" stop-color="#8957E5"/>
      <stop offset="0.5"  stop-color="#58A6FF"/>
      <stop offset="0.75" stop-color="#8957E5"/>
      <stop offset="1"    stop-color="#58A6FF"/>
    </linearGradient>
  </defs>

  <!-- back wave (slower) -->
  <path fill="url(#wave2)" fill-opacity="0.35"
        d="M0,70 C200,30 400,110 600,70 C800,30 1000,110 1200,70 C1400,30 1600,110 1800,70 C2000,30 2200,110 2400,70 L2400,120 L0,120 Z">
    <animateTransform attributeName="transform" type="translate" from="0 0" to="-1200 0" dur="18s" repeatCount="indefinite"/>
  </path>

  <!-- front wave -->
  <path fill="url(#wave1)" fill-opacity="0.75"
        d="M0,85 C150,55 450,115 600,85 C750,55 1050,115 1200,85 C1350,55 1650,115 1800,85 C1950,55 2250,115 2400,85 L2400,120 L0,120 Z">
    <animateTransform attributeName="transform" type="translate" from="-1200 0" to="0 0" dur="12s" repeatCount="indefinite"/>
  </path>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
