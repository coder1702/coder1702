<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest">
  <title id="t">Kalp Shah</title>
  <desc id="d">Terminal window showing the command whoami and the name Kalp Shah, Software Developer.</desc>

  <defs>
    <!-- PALETTE: bg #0D1117 | panel #161B22 | border #30363D | blue #58A6FF | blue-deep #1F6FEB | purple #8957E5 | text #C9D1D9 | muted #8B949E -->
    <linearGradient id="name" gradientUnits="userSpaceOnUse" x1="76" y1="0" x2="440" y2="0">
      <stop offset="0" stop-color="#58A6FF"/>
      <stop offset="1" stop-color="#8957E5"/>
    </linearGradient>
    <radialGradient id="glowBlue" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#1F6FEB" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#1F6FEB" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowPurple" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8957E5" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#8957E5" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" fill="none" stroke="#21262D" stroke-width="1"/>
    </pattern>
    <clipPath id="typeClip">
      <rect x="76" y="86" width="120" height="26">
        <animate attributeName="width" begin="0s" dur="1.3s" fill="freeze" calcMode="discrete"
                 values="0;0;0;12;24;36;48;60;72;84;96;120"
                 keyTimes="0;0.1;0.2;0.28;0.36;0.44;0.52;0.6;0.68;0.76;0.84;1"/>
      </rect>
    </clipPath>
  </defs>

  <style>
    text { font-family: 'JetBrains Mono', 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; }
    .cursor { animation: blink 1.1s steps(1) infinite; }
    .glow   { animation: pulse 6s ease-in-out infinite; }
    .glow2  { animation: pulse 6s ease-in-out infinite reverse; }
    .rise   { animation: rise 0.8s ease-out 1.5s backwards; }
    @keyframes blink { 0%, 50% { opacity: 1 } 51%, 100% { opacity: 0 } }
    @keyframes pulse { 0%, 100% { opacity: 0.55 } 50% { opacity: 1 } }
    @keyframes rise  { from { opacity: 0; transform: translateY(8px) } to { opacity: 1; transform: translateY(0) } }
    @media (prefers-reduced-motion: reduce) {
      .cursor, .glow, .glow2 { animation: none }
      .rise { animation: none }
    }
  </style>

  <!-- background -->
  <rect width="1200" height="300" fill="#0D1117"/>
  <rect width="1200" height="300" fill="url(#grid)"/>
  <ellipse class="glow"  cx="170"  cy="60"  rx="320" ry="170" fill="url(#glowBlue)"/>
  <ellipse class="glow2" cx="1050" cy="250" rx="340" ry="170" fill="url(#glowPurple)"/>

  <!-- terminal window -->
  <rect x="40" y="24" width="1120" height="252" rx="12" fill="#161B22" fill-opacity="0.92" stroke="#30363D"/>
  <path d="M40 36a12 12 0 0 1 12-12h1096a12 12 0 0 1 12 12v28H40z" fill="#1C2128"/>
  <line x1="40" y1="64" x2="1160" y2="64" stroke="#30363D"/>
  <circle cx="68"  cy="44" r="6" fill="#FF5F56"/>
  <circle cx="90"  cy="44" r="6" fill="#FFBD2E"/>
  <circle cx="112" cy="44" r="6" fill="#27C93F"/>
  <text x="600" y="49" font-size="13" fill="#8B949E" text-anchor="middle">kalp@shah: ~/profile</text>

  <!-- decorative code glyph -->
  <text x="1135" y="225" font-size="150" font-weight="700" fill="#58A6FF" fill-opacity="0.06" text-anchor="end">&lt;/&gt;</text>

  <!-- command (typed in) -->
  <g clip-path="url(#typeClip)">
    <text x="76" y="105" font-size="20"><tspan fill="#3FB950">$</tspan><tspan fill="#C9D1D9"> whoami</tspan></text>
  </g>

  <!-- output (fades in after the command) -->
  <g class="rise">
    <text x="76" y="178" font-size="62" font-weight="700" fill="url(#name)">Kalp Shah</text>
    <text x="78" y="214" font-size="19" fill="#8B949E">Software Developer <tspan fill="#30363D">//</tspan> Backend <tspan fill="#30363D">·</tspan> AI/ML <tspan fill="#30363D">·</tspan> Mobile</text>
  </g>

  <!-- idle prompt -->
  <text x="76" y="256" font-size="20" fill="#3FB950">$</text>
  <rect class="cursor" x="98" y="240" width="11" height="20" fill="#58A6FF"/>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
