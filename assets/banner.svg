<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-label="Kalp Shah - Software Developer" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0D1117"/>
      <stop offset="0.55" stop-color="#0B1630"/>
      <stop offset="1" stop-color="#1A1033"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#58A6FF"/>
      <stop offset="1" stop-color="#A371F7"/>
    </linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#58A6FF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#58A6FF" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#58A6FF" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glowL" cx="0.15" cy="0.2" r="0.6">
      <stop offset="0" stop-color="#1F6FEB" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#1F6FEB" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowR" cx="0.9" cy="0.9" r="0.6">
      <stop offset="0" stop-color="#8957E5" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#8957E5" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" fill="none" stroke="#58A6FF" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <clipPath id="frame"><rect x="0" y="0" width="1200" height="260" rx="14"/></clipPath>
  </defs>

  <g clip-path="url(#frame)" font-family="'JetBrains Mono','Fira Code','SFMono-Regular',Consolas,'Courier New',monospace">
    <!-- background -->
    <rect width="1200" height="260" fill="url(#bg)"/>
    <rect width="1200" height="260" fill="url(#grid)"/>
    <rect width="1200" height="260" fill="url(#glowL)"/>
    <rect width="1200" height="260" fill="url(#glowR)"/>

    <!-- scanline -->
    <rect x="0" y="-60" width="1200" height="60" fill="url(#scan)">
      <animate attributeName="y" from="-60" to="260" dur="5s" repeatCount="indefinite"/>
    </rect>

    <!-- window bar -->
    <rect x="0" y="0" width="1200" height="38" fill="#0D1117" fill-opacity="0.85"/>
    <line x1="0" y1="38" x2="1200" y2="38" stroke="#30363D"/>
    <circle cx="26" cy="19" r="6" fill="#FF5F56"/>
    <circle cx="48" cy="19" r="6" fill="#FFBD2E"/>
    <circle cx="70" cy="19" r="6" fill="#27C93F"/>
    <text x="600" y="24" text-anchor="middle" font-size="13" fill="#8B949E">kalp@dev: ~/coder1702 — zsh</text>

    <!-- left: prompt + name -->
    <text x="60" y="88" font-size="18" fill="#3FB950">➜</text>
    <text x="86" y="88" font-size="18" fill="#58A6FF">~</text>
    <text x="110" y="88" font-size="18" fill="#C9D1D9">whoami</text>

    <text x="60" y="158" font-size="62" font-weight="700" fill="url(#title)">Kalp Shah</text>
    <rect x="370" y="112" width="26" height="52" fill="#58A6FF">
      <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1.1s" repeatCount="indefinite"/>
    </rect>

    <text x="62" y="196" font-size="19" fill="#8B949E">
      <tspan fill="#A371F7">Software Developer</tspan>
      <tspan fill="#484F58"> / </tspan><tspan>Backend</tspan>
      <tspan fill="#484F58"> / </tspan><tspan>AI·ML</tspan>
      <tspan fill="#484F58"> / </tspan><tspan>Mobile</tspan>
    </text>

    <!-- status chips -->
    <g font-size="12">
      <rect x="62" y="214" width="120" height="24" rx="12" fill="#238636" fill-opacity="0.18" stroke="#238636"/>
      <circle cx="80" cy="226" r="4" fill="#3FB950">
        <animate attributeName="opacity" values="1;0.25;1" dur="1.8s" repeatCount="indefinite"/>
      </circle>
      <text x="92" y="230" fill="#3FB950">status: building</text>
      <rect x="194" y="214" width="118" height="24" rx="12" fill="#1F6FEB" fill-opacity="0.15" stroke="#1F6FEB"/>
      <text x="208" y="230" fill="#58A6FF">stack: full-stack</text>
    </g>

    <!-- right: code panel -->
    <g font-size="15">
      <rect x="720" y="62" width="440" height="176" rx="10" fill="#0D1117" fill-opacity="0.7" stroke="#30363D"/>

      <text x="744" y="92" fill="#6E7681" opacity="0">1
        <animate attributeName="opacity" to="1" begin="0.2s" dur="0.4s" fill="freeze"/></text>
      <text x="772" y="92" opacity="0"><tspan fill="#FF7B72">const</tspan><tspan fill="#C9D1D9"> dev </tspan><tspan fill="#FF7B72">=</tspan><tspan fill="#C9D1D9"> {</tspan>
        <animate attributeName="opacity" to="1" begin="0.2s" dur="0.4s" fill="freeze"/></text>

      <text x="744" y="118" fill="#6E7681" opacity="0">2
        <animate attributeName="opacity" to="1" begin="0.7s" dur="0.4s" fill="freeze"/></text>
      <text x="796" y="118" opacity="0"><tspan fill="#79C0FF">backend</tspan><tspan fill="#C9D1D9">: [</tspan><tspan fill="#A5D6FF">"FastAPI"</tspan><tspan fill="#C9D1D9">, </tspan><tspan fill="#A5D6FF">"Flask"</tspan><tspan fill="#C9D1D9">],</tspan>
        <animate attributeName="opacity" to="1" begin="0.7s" dur="0.4s" fill="freeze"/></text>

      <text x="744" y="144" fill="#6E7681" opacity="0">3
        <animate attributeName="opacity" to="1" begin="1.2s" dur="0.4s" fill="freeze"/></text>
      <text x="796" y="144" opacity="0"><tspan fill="#79C0FF">mobile</tspan><tspan fill="#C9D1D9">: </tspan><tspan fill="#A5D6FF">"Flutter"</tspan><tspan fill="#C9D1D9">,</tspan>
        <animate attributeName="opacity" to="1" begin="1.2s" dur="0.4s" fill="freeze"/></text>

      <text x="744" y="170" fill="#6E7681" opacity="0">4
        <animate attributeName="opacity" to="1" begin="1.7s" dur="0.4s" fill="freeze"/></text>
      <text x="796" y="170" opacity="0"><tspan fill="#79C0FF">data</tspan><tspan fill="#C9D1D9">: </tspan><tspan fill="#A5D6FF">"PostgreSQL"</tspan><tspan fill="#C9D1D9">,</tspan>
        <animate attributeName="opacity" to="1" begin="1.7s" dur="0.4s" fill="freeze"/></text>

      <text x="744" y="196" fill="#6E7681" opacity="0">5
        <animate attributeName="opacity" to="1" begin="2.2s" dur="0.4s" fill="freeze"/></text>
      <text x="796" y="196" opacity="0"><tspan fill="#79C0FF">ai</tspan><tspan fill="#C9D1D9">: </tspan><tspan fill="#79C0FF">true</tspan><tspan fill="#C9D1D9">,</tspan>
        <animate attributeName="opacity" to="1" begin="2.2s" dur="0.4s" fill="freeze"/></text>

      <text x="744" y="222" fill="#6E7681" opacity="0">6
        <animate attributeName="opacity" to="1" begin="2.7s" dur="0.4s" fill="freeze"/></text>
      <text x="772" y="222" opacity="0"><tspan fill="#C9D1D9">};</tspan>
        <animate attributeName="opacity" to="1" begin="2.7s" dur="0.4s" fill="freeze"/></text>
    </g>
  </g>

  <rect x="0.5" y="0.5" width="1199" height="259" rx="14" fill="none" stroke="#30363D"/>
</svg>
